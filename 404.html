<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- seo:start -->
  <title>Página não encontrada | Dr. Luciano Canonico</title>
  <meta name="description" content="A página que você procurou não existe ou mudou de endereço. Volte ao início do site do Dr. Luciano Canonico." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0A1626" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- seo:end -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #1B2A3B; --ink-2: #12283F; --muted: #4C6076; --bg-soft: #EAF4FC; --black: #1F6FCC; --ease: cubic-bezier(.16, 1, .3, 1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100svh; display: grid; place-items: center; padding: 24px; background: linear-gradient(160deg, #0A1626 0%, #060D16 100%); color: #fff; font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 34rem; }
    .code { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: clamp(4rem, 14vw, 7rem); letter-spacing: -.04em; line-height: 1; color: rgba(255,255,255,.14); }
    h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: clamp(1.6rem, 4vw, 2.2rem); letter-spacing: -.025em; line-height: 1.15; margin: 8px 0 14px; text-wrap: balance; }
    p { color: rgba(255,255,255,.72); margin-bottom: 30px; text-wrap: pretty; }
    a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 13px 26px; border-radius: 999px; background: var(--black); border: 1.5px solid var(--black); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; transition: transform .3s var(--ease), background .3s var(--ease); }
    @media (hover: hover) and (pointer: fine) { a.btn:hover { background: #2B7FE0; } }
    a.btn:active { transform: scale(.98); }
    a.btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    /* base mobile: sem flash de toque, sem inflar fonte, toque imediato, rotulos de controle nao selecionaveis */
    html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    a, button, [role="button"], summary { touch-action: manipulation; }
    .btn, button, .nav-toggle, .nav-drop a, .wa-float, .top-float, .chip { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    input, textarea, select { font-size: max(16px, 1em); }
    /* conteudo nunca fica atras do notch em paisagem (so vale com viewport-fit=cover) */
    @supports (padding: max(0px)) {
      .container { padding-left: max(24px, env(safe-area-inset-left)); padding-right: max(24px, env(safe-area-inset-right)); }
      @media (min-width: 960px) { .container { padding-left: max(40px, env(safe-area-inset-left)); padding-right: max(40px, env(safe-area-inset-right)); } }
    }
  </style>
</head>

<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>Não encontramos essa página</h1>
    <p>O endereço pode ter mudado ou não existe mais. Volte ao início para continuar navegando.</p>
    <a class="btn" href="/">Voltar ao início</a>
  </main>
</body>

</html>
